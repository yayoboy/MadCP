# ============================================================================
# MadCP - Portainer Stack Configuration
# ============================================================================
#
# Stack ottimizzato per deployment tramite Portainer.
# Testato e funzionante su Portainer CE/BE 2.19+
#
# DEPLOYMENT IN PORTAINER:
#
#   METODO 1 - Da Repository Git (Raccomandato):
#     1. Portainer → Stacks → Add stack
#     2. Nome: madcp
#     3. Build method: Repository
#     4. Repository URL: https://github.com/yayoboy/MadCP
#     5. Repository reference: main
#     6. Compose path: portainer-stack.yml
#     7. Environment variables: Aggiungi le variabili (vedi sotto)
#     8. Deploy the stack
#
#   METODO 2 - Web Editor:
#     1. Portainer → Stacks → Add stack
#     2. Nome: madcp
#     3. Build method: Web editor
#     4. Copia/incolla questo file
#     5. Environment variables: Aggiungi le variabili (vedi sotto)
#     6. Deploy the stack
#
# VARIABILI OBBLIGATORIE (da configurare in Portainer UI):
#   POSTGRES_PASSWORD=your-secure-password-here
#   JWT_SECRET_KEY=your-jwt-secret-min-32-characters
#
# VARIABILI OPZIONALI:
#   OPENAI_API_KEY=sk-your-key           # Per funzionalità AI
#   ANTHROPIC_API_KEY=sk-ant-your-key    # Opzionale
#   POSTGRES_DB=madcp                     # Default: madcp
#   POSTGRES_USER=madcp                   # Default: madcp
#   API_PORT=8000                         # Default: 8000
#
# ============================================================================

version: '3.8'

# ============================================================================
# Networks
# ============================================================================
networks:
  madcp:
    driver: bridge

# ============================================================================
# Volumes (Named volumes - gestiti da Docker)
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

# ============================================================================
# Services
# ============================================================================
services:

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: madcp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-madcp}
      POSTGRES_USER: ${POSTGRES_USER:-madcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required - Set in Portainer environment variables}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    networks:
      - madcp

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madcp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    labels:
      - "io.portainer.accesscontrol.public=true"
      - "madcp.service=database"

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: madcp-redis
    restart: unless-stopped

    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    ports:
      - "${REDIS_PORT:-6379}:6379"

    networks:
      - madcp

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    labels:
      - "io.portainer.accesscontrol.public=true"
      - "madcp.service=cache"

  # ==========================================================================
  # Qdrant Vector Database
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: madcp-qdrant
    restart: unless-stopped

    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}

    volumes:
      - qdrant_data:/qdrant/storage

    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"

    networks:
      - madcp

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    labels:
      - "io.portainer.accesscontrol.public=true"
      - "madcp.service=vector-db"

  # ==========================================================================
  # MadCP Core API
  # ==========================================================================
  # NOTA: Questo servizio viene buildato dalla sorgente.
  #       Portainer supporta build da Git repository.
  # ==========================================================================
  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
      target: production
      args:
        - BUILD_DATE=${BUILD_DATE:-2024-01-01}
        - VCS_REF=${VCS_REF:-unknown}

    image: madcp-core-api:${IMAGE_TAG:-latest}
    container_name: madcp-core-api
    restart: unless-stopped

    environment:
      # Application
      APP_NAME: ${APP_NAME:-MadCP}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}

      # Server
      HOST: 0.0.0.0
      PORT: 8000

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-madcp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-madcp}

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION:-madcp_embeddings}

      # LLM Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required - Set in Portainer environment variables}

      # Features
      FEATURE_SEMANTIC_SEARCH: ${FEATURE_SEMANTIC_SEARCH:-true}
      FEATURE_CODE_ANALYSIS: ${FEATURE_CODE_ANALYSIS:-true}
      FEATURE_AI_ASSISTANCE: ${FEATURE_AI_ASSISTANCE:-true}
      FEATURE_PLANNING: ${FEATURE_PLANNING:-true}
      PLUGINS_ENABLED: ${PLUGINS_ENABLED:-true}

      # Monitoring
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      # Performance
      WORKERS: ${WORKERS:-1}

    ports:
      - "${API_PORT:-8000}:8000"

    networks:
      - madcp

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    labels:
      - "io.portainer.accesscontrol.public=true"
      - "madcp.service=core-api"
      # Traefik labels (se usi Traefik come reverse proxy)
      - "traefik.enable=${TRAEFIK_ENABLED:-false}"
      - "traefik.http.routers.madcp-api.rule=Host(`${API_DOMAIN:-api.madcp.local}`)"
      - "traefik.http.services.madcp-api.loadbalancer.server.port=8000"

# ============================================================================
# INSTRUZIONI POST-DEPLOYMENT
# ============================================================================
#
# Dopo il deployment:
#
# 1. VERIFICA STATO:
#    Portainer → Containers → Controlla che tutti siano "healthy" (verde)
#
# 2. CONTROLLA LOGS:
#    Portainer → Containers → madcp-core-api → Logs
#    Cerca "Application startup complete" o errori
#
# 3. TESTA L'API:
#    Apri nel browser: http://YOUR_SERVER_IP:8000/docs
#    Dovresti vedere la documentazione Swagger
#
# 4. HEALTH CHECK:
#    curl http://YOUR_SERVER_IP:8000/health
#    Risposta attesa: {"status":"healthy","version":"1.0.0",...}
#
# 5. INIZIALIZZAZIONE DATABASE (se necessario):
#    Se devi importare lo schema iniziale:
#      docker exec -i madcp-postgres psql -U madcp madcp < init.sql
#    Oppure usa Portainer → Containers → madcp-postgres → Console
#
# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#
# PROBLEMA: Container "unhealthy"
# SOLUZIONE:
#   1. Verifica logs del container
#   2. Controlla variabili d'ambiente in Portainer Stack Editor
#   3. Verifica che POSTGRES_PASSWORD e JWT_SECRET_KEY siano impostate
#
# PROBLEMA: "Build failed"
# SOLUZIONE:
#   1. Verifica che il repository sia accessibile
#   2. Controlla che il Dockerfile esista in services/core-api/
#   3. Verifica connessione internet del server Portainer
#
# PROBLEMA: Connection refused
# SOLUZIONE:
#   1. Verifica che tutti i servizi siano started
#   2. Attendi che i health checks passino (può richiedere 1-2 min)
#   3. Controlla che le porte non siano già in uso
#
# PROBLEMA: Porta già in uso
# SOLUZIONE:
#   In Portainer Stack Editor, modifica:
#     API_PORT=8080    # Invece di 8000
#   Poi Update the stack
#
# ============================================================================
# AGGIORNAMENTI
# ============================================================================
#
# Per aggiornare MadCP:
#
# METODO 1 - Pull & Redeploy:
#   1. Portainer → Stacks → madcp
#   2. Click "Pull and redeploy"
#   3. Attendi completamento
#
# METODO 2 - Git Webhook (Auto-update):
#   1. Portainer → Stacks → madcp → Editor
#   2. Abilita "Enable GitOps updates"
#   3. Configura polling interval o webhook
#   4. Gli aggiornamenti avverranno automaticamente
#
# ============================================================================
# BACKUP & RESTORE
# ============================================================================
#
# BACKUP DATABASE:
#   docker exec madcp-postgres pg_dump -U madcp madcp > backup_$(date +%Y%m%d).sql
#
# RESTORE DATABASE:
#   docker exec -i madcp-postgres psql -U madcp madcp < backup_20240101.sql
#
# BACKUP VOLUMI (tramite Portainer):
#   Portainer → Volumes → postgres_data → Export
#
# ============================================================================
# SICUREZZA - CHECKLIST PRODUZIONE
# ============================================================================
#
# Prima di usare in produzione:
#
#  [ ] Cambia POSTGRES_PASSWORD con password sicura (min 16 caratteri)
#  [ ] Genera JWT_SECRET_KEY sicuro (min 32 caratteri): openssl rand -hex 32
#  [ ] Imposta DEBUG=false
#  [ ] Configura CORS_ORIGINS per il tuo dominio
#  [ ] Abilita TLS/SSL (usa Traefik o Nginx reverse proxy)
#  [ ] Limita esposizione porte (usa reverse proxy invece di porte dirette)
#  [ ] Configura firewall per limitare accesso
#  [ ] Abilita backup automatici
#  [ ] Configura monitoring e alerting
#  [ ] Usa secrets Docker per credenziali (invece di environment variables)
#  [ ] Verifica che LOG_LEVEL sia WARNING o ERROR (non DEBUG/INFO)
#
# ============================================================================
