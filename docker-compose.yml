# ============================================================================
# MadCP - Docker Compose (Local Development & Testing)
# ============================================================================
#
# Configurazione funzionante per sviluppo locale e testing rapido.
#
# QUICK START:
#   1. cp .env.example .env
#   2. Modifica .env con le tue API keys
#   3. docker-compose up -d
#   4. Apri http://localhost:8000/docs
#
# COMANDI UTILI:
#   docker-compose up -d              # Avvia tutti i servizi
#   docker-compose ps                 # Verifica stato
#   docker-compose logs -f core-api   # Segui logs
#   docker-compose down               # Ferma tutto
#   docker-compose down -v            # Ferma e rimuovi volumi
#
# ============================================================================

version: '3.8'

# ============================================================================
# Networks
# ============================================================================
networks:
  madcp:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
  redis_data:
  qdrant_data:

# ============================================================================
# Services
# ============================================================================
services:

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: madcp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-madcp}
      POSTGRES_USER: ${POSTGRES_USER:-madcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-madcp_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init SQL (opzionale, commentato per default)
      # - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    networks:
      - madcp

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madcp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: madcp-redis
    restart: unless-stopped

    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    ports:
      - "${REDIS_PORT:-6379}:6379"

    networks:
      - madcp

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # ==========================================================================
  # Qdrant Vector Database
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: madcp-qdrant
    restart: unless-stopped

    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}

    volumes:
      - qdrant_data:/qdrant/storage

    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"

    networks:
      - madcp

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # MadCP Core API
  # ==========================================================================
  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
      target: development

    image: madcp-core-api:local
    container_name: madcp-core-api
    restart: unless-stopped

    environment:
      # Application
      APP_NAME: ${APP_NAME:-MadCP}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}

      # Server
      HOST: 0.0.0.0
      PORT: 8000

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-madcp}:${POSTGRES_PASSWORD:-madcp_dev_password}@postgres:5432/${POSTGRES_DB:-madcp}

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION:-madcp_embeddings}

      # LLM (opzionali)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-DO-NOT-USE-IN-PRODUCTION}

      # Features
      FEATURE_SEMANTIC_SEARCH: ${FEATURE_SEMANTIC_SEARCH:-true}
      FEATURE_CODE_ANALYSIS: ${FEATURE_CODE_ANALYSIS:-true}
      FEATURE_AI_ASSISTANCE: ${FEATURE_AI_ASSISTANCE:-true}
      FEATURE_PLANNING: ${FEATURE_PLANNING:-true}
      PLUGINS_ENABLED: ${PLUGINS_ENABLED:-true}

      # Monitoring
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}

    volumes:
      # Mount source code for hot reload in development
      - ./services/core-api/app:/app/app:ro
      # Config files (optional)
      # - ./config:/app/config:ro

    ports:
      - "${API_PORT:-8000}:8000"

    networks:
      - madcp

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ============================================================================
# NOTES:
# ============================================================================
#
# 1. ENVIRONMENT VARIABLES:
#    Crea un file .env nella root del progetto con:
#      POSTGRES_PASSWORD=your_password
#      JWT_SECRET_KEY=your_secret_key
#      OPENAI_API_KEY=sk-your-key
#
# 2. INIZIALIZZAZIONE DATABASE:
#    Per importare lo schema iniziale, uncommenta il volume
#    ./infrastructure/docker/postgres/init.sql nel servizio postgres
#
# 3. HOT RELOAD:
#    Il volume ./services/core-api/app:/app/app permette hot reload
#    in development. Rimuovilo in produzione.
#
# 4. PORTE:
#    Puoi modificare le porte tramite .env:
#      API_PORT=8080
#      POSTGRES_PORT=5433
#      REDIS_PORT=6380
#
# 5. FIRST RUN:
#    Al primo avvio, aspetta che tutti i servizi siano healthy:
#      docker-compose ps
#    Poi testa l'API:
#      curl http://localhost:8000/health
#
# ============================================================================
